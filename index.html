<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<title>AMSAC Futsal Manager</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo" id="brandLogo">AM</div>
      <div><strong>AMSAC</strong><small>FUTSAL MANAGER</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-bottom">
      <div class="user-dot">D</div><div><b>Treinador</b><small>Equipa AMSAC</small></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn mobile-menu" onclick="toggleSidebar()">☰</button>
      <div><small id="crumb">AMSAC FUTSAL MANAGER</small><h1 id="pageTitle">Início</h1><p id="pageSub">Dashboard da equipa</p></div>
      <div class="top-actions"><span class="sync" id="syncState">● Local</span><button class="icon-btn" onclick="toggleSidebar()">☰</button></div>
    </header>
    <section id="content"></section>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button class="modal-x" onclick="closeModal()">×</button>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
